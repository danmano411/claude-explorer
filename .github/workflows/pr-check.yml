name: PR Check

# Fast, cheap check on every PR into main. Intended to be configured as a
# required status check (job id/name: "test") in branch protection — that
# repo setting is a separate, manual step once this workflow exists on main.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check & test
    # windows-latest, NOT ubuntu-latest, and this is not a cost oversight:
    # the suite cannot pass on POSIX today. src/main/cli.ts imports `resolve`
    # from 'node:path' — the PLATFORM-DEFAULT implementation — while
    # cli.test.ts asserts Windows-shaped output ('C:\base\sub\dir'). On Linux
    # path.posix.resolve treats 'C:\base' as one relative segment and prefixes
    # cwd, so those assertions fail. Same class of problem across the fixtures
    # that feed real Windows paths to platform-default path code.
    #
    # Moving this to ubuntu-latest (cheaper, faster) is correct ONLY after
    # KAN-89 lands the cross-platform path abstraction and KAN-90 the POSIX
    # branches. Until then a Linux runner would make this required check fail
    # on every PR, which is worse than useless — it trains people to ignore it.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # NODE_OPTIONS=--experimental-require-module is already set inside the
      # "test" script itself (package.json), so plain `npm test` is correct
      # here. The KAN-67 env-leak quirk that fails 2 pty.test.ts assertions
      # when run inside a Claude Explorer terminal does not apply on a
      # runner: GitHub Actions sets no CLAUDE_EXPLORER_* variables.
      - name: Test
        run: npm test

      # KAN-98: KAN-96 shipped a v0.10.0 draft with the renderer completely
      # broken (#root empty, React never mounted) while tsc + the unit suite
      # above were both green — vitest runs in node, where the bare
      # `process.platform` that broke the renderer under contextIsolation
      # doesn't throw. Nothing above this step ever launches the real app;
      # this is the one thing in CI that does.
      - name: Build
        run: npm run build

      - name: Smoke test (renderer actually rendered)
        run: node test/harness/smoke.mjs
