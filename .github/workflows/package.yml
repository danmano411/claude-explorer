name: Package

# Packaging. Runs on a version-tag push (matching release.ps1's `v<version>`
# tag convention) or manual dispatch. `workflow_dispatch` builds but never
# publishes; only a tag push creates a release, and it is a DRAFT — Dan still
# publishes manually (see CLAUDE.md "Release process"). Nothing auto-publishes.
#
# Three platforms: Windows (NSIS), macOS (DMG, one leg per architecture) and
# Linux (AppImage). No leg runs the test suite — that is PR Check's job, on
# every PR into main; duplicating it here would only make releases slower.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `--publish never`, always. electron-builder 26.x's own `--publish
      # always` races itself into duplicate drafts (see release.ps1 and
      # CLAUDE.md's Release process section) — that bug is why release.ps1
      # never uses electron-builder to publish and instead calls `gh
      # release create` itself once, by hand, over already-built files. The
      # publish-draft job below reproduces exactly that, from artifacts
      # collected here.
      - name: Package (NSIS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      # electron-builder writes dist/latest.yml referencing the HYPHENATED
      # asset name ("Claude-Explorer-Setup-<version>.exe") because GitHub
      # mangles spaces in release asset filenames, but the NSIS installer it
      # actually produces is named with spaces
      # ("Claude Explorer Setup <version>.exe"). release.ps1 copies the
      # built files to the hyphenated names before uploading so the asset
      # electron-updater fetches matches what latest.yml points at — mirror
      # that exactly here.
      - name: Rename installer assets to match latest.yml
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dist = Join-Path $PWD 'dist'
          $exe = Join-Path $dist "Claude-Explorer-Setup-$version.exe"
          Copy-Item (Join-Path $dist "Claude Explorer Setup $version.exe") $exe -Force
          Copy-Item (Join-Path $dist "Claude Explorer Setup $version.exe.blockmap") "$exe.blockmap" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Claude-Explorer-Setup-*.exe
            dist/Claude-Explorer-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  # KAN-92. UNSIGNED, by owner decision — no Apple Developer Program
  # membership ($99/yr), so no `Developer ID Application` certificate, no
  # notarization, and NO SIGNING SECRETS ANYWHERE IN THIS FILE. The visible
  # consequence is Gatekeeper: users get "Apple cannot check this app for
  # malicious software" and must right-click → Open (or allow it under System
  # Settings → Privacy & Security). README's Platform support section says so.
  #
  # electron-builder still ad-hoc signs the arm64 bundle (`codesign -s -`)
  # because an Apple Silicon binary with NO signature at all cannot execute.
  # That is automatic and needs no config — which is why `mac.identity` is
  # left unset in package.json rather than set to null: null means "skip
  # signing entirely" and would produce an arm64 app that refuses to launch.
  #
  # Auto-update is disabled on macOS in src/main/updater.ts (Squirrel.Mac
  # verifies a Developer ID signature that does not exist), so this leg
  # deliberately builds DMG ONLY. electron-builder's usual advice is to ship a
  # zip alongside the DMG, but a zip's only job is to feed electron-updater —
  # with no update path it is a second ~100 MB asset nobody can use, and the
  # DMG is what a Mac user expects to download anyway. Add `zip` to
  # build.mac.target, and latest-mac.yml to publish-draft, the day signing lands.
  #
  # One leg per architecture rather than a universal binary, because
  # @vscode/ripgrep ships per-arch optional dependencies: `npm ci` on an
  # arm64 runner installs @vscode/ripgrep-darwin-arm64 and NOT -darwin-x64,
  # so a cross-built x64 package would fail to find its extraResources.
  # node-pty is fine either way — it vendors every prebuild in one package.
  macos:
    name: macOS (DMG, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One arch failing must not cancel the other; they are separate
      # deliverables and a broken Intel leg should not hide a good arm64 DMG.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (DMG)
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      # Only the DMG. latest-mac.yml is generated but deliberately NOT
      # uploaded: publishing an update feed for a platform whose updater is
      # switched off is how a user ends up with a download that cannot install.
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/Claude-Explorer-*.dmg
          if-no-files-found: error

  # KAN-93. AppImage only: the one Linux artifact electron-updater can update,
  # and it needs no package manager. deb/rpm users update through theirs.
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BEFORE npm ci, and installed explicitly rather than assumed present.
      # node-pty's prebuilds/ has darwin-arm64, darwin-x64, win32-arm64 and
      # win32-x64 — and NOTHING for Linux — so its install script falls back to
      # `node-gyp rebuild`, which needs a C++ toolchain and python3. Trusting
      # the runner image for this is exactly what breaks silently the next time
      # GitHub rotates it.
      - name: Install node-pty build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # npmRebuild stays false even here: node-pty is N-API, so the binary
      # node-gyp just produced above loads in Electron unchanged.
      - name: Package (AppImage)
        run: npx electron-builder --linux --publish never

      # latest-linux.yml IS uploaded — unlike macOS, AppImage auto-update
      # works, so electron-updater needs its feed in the release.
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/Claude-Explorer-*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  publish-draft:
    name: Publish draft release
    needs: [windows, macos, linux]
    # Only a tag push publishes anything; `workflow_dispatch` builds/tests
    # every leg and stops (artifacts stay attached to the run for
    # inspection). `success()` must be explicit: adding a custom `if:` to a
    # job replaces the default "all `needs` succeeded" gate rather than
    # adding to it.
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      # Two mac legs, one artifact each; merge-multiple flattens them into the
      # same dist/ since their filenames already carry the architecture.
      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg-*
          merge-multiple: true
          path: dist

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist

      # Update feeds: latest.yml (Windows) and latest-linux.yml (AppImage).
      # There is no latest-mac.yml on purpose — see the macos job's comment.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft --title "${{ github.ref_name }}" --generate-notes \
            dist/Claude-Explorer-Setup-*.exe \
            dist/Claude-Explorer-Setup-*.exe.blockmap \
            dist/latest.yml \
            dist/Claude-Explorer-*.dmg \
            dist/Claude-Explorer-*.AppImage \
            dist/latest-linux.yml
