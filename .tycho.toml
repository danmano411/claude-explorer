# .tycho.toml — Tycho configuration. Managed by `tycho scope` / `tycho relay`; also safe
# to hand-edit. Tycho never assumes this file exists: with an empty `include` below,
# `scope_drift` stays UNSUPPORTED and every other check runs as it does with no file.

[scope]
# Directories/files the agent is allowed to edit, as globs with POSIX separators
# (e.g. "src/**", "tests/**"). An edit outside these FAILs scope_drift. This is an
# explicit, deterministic bound — never inferred from the prompt.
# Manage with: tycho scope add|remove|set <glob>...  (or /tycho-scope-* in Claude Code)
include = []
# Paths to carve back OUT of `include`, same glob syntax. An edit matching any of these
# FAILs scope_drift even if it also matches `include` — exclude wins (e.g. include "**",
# exclude "LICENSE" allows the whole tree but that one file). Empty = pure allowlist.
# Manage with: tycho scope add|remove|set --exclude <glob>...
exclude = []

[checks]
# Check names to disable entirely (rarely needed), e.g. "command_execution".
disable = []

[tests]
# Runner filters this project puts on every test run, as you'd type them, e.g.
# standing = ["-m \"not e2e\""]. A filter narrows a run, so a green carrying one
# normally can't stand in for a red that ran without it. Declared here it is dropped
# from both sides before they're compared, because it restricts both alike. Declare
# ONLY what genuinely runs every time — anything else here hides a real narrowing.
# Selectors naming last run's failures (--lf, --sw) are never cancelled even if listed.
standing = []

[relay]
# Feed a non-VERIFIED verdict back to the agent so it keeps working until VERIFIED
# (Claude Code only, bounded by TYCHO_RELAY_MAX). Off by default — verdicts stay
# human-only. Toggle: tycho relay --on|--off  (or /tycho-relay-on / -off in Claude Code).
enabled = false

[override]
# Let the agent record a per-check verdict override (`tycho override <check> "<reason>"`)
# when the relay is on and it can justify that a check does not apply. Produces the
# distinct OVERRIDDEN verdict (agent-authorized, NOT proven) and is logged to
# .tycho/overrides.json. Off by default. Toggle: tycho override --on|--off.
enabled = false

[rewrite]
# Route a piped test runner through `tycho exec` so its real exit status survives:
# `pytest | tail -20` hands the harness tail's status and pytest's is gone before any
# check could read it. Claude Code only (PreToolUse). Off by default because your
# `Bash(...)` permission rules are matched against the *rewritten* command, so a
# `Bash(pytest:*)` allow rule would stop covering it and a silent run would start
# asking. Not needed under `--permission-mode bypassPermissions`, where there are no
# rules to void and the rewrite always applies. Toggle: tycho rewrite --on|--off.
enabled = false
